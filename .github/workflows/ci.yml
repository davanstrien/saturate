name: ci
on: [push, pull_request, workflow_call]
jobs:
  test:
    runs-on: ubuntu-latest
    # every supported version (requires-python >= 3.10); 3.14t (free-threaded) is informational
    # until the scientific stack ships free-threaded wheels for everything the suite imports
    continue-on-error: ${{ matrix.python == '3.14t' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - name: the lock names public PyPI only
        # a maintainer's private index or mirror would otherwise leak into it
        shell: bash
        run: |
          set -euo pipefail
          registries=$(grep -oE 'registry = "[^"]+"' uv.lock | sort -u)
          echo "$registries"
          test "$registries" = 'registry = "https://pypi.org/simple"'
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run --with blacken-docs blacken-docs -l 100 README.md CONTRACT.md docs/*.md && git diff --exit-code
      - run: uv run pytest tests/ -q
      - name: contract suite size (the tests a refactor must pass unchanged)
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/ -m 'not internals' --collect-only -q | tail -n 1
      - run: uv run --extra hf python -c "from huggingface_hub import HfFileSystem; HfFileSystem()"
  types:
    # ty (pinned in the dev group) over the package; files still to be typed are excluded in
    # pyproject.toml [tool.ty.src] and come off that list as they are rewritten
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run ty check saturate
      - name: excluded files, for the record (informational; drift from the baseline shows here)
        run: uv run ty check saturate/core.py --output-format concise | tail -n 1 || true
  lowest:
    # the declared dependency floors: an unlocked sync only ever tests the newest releases
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.10
      - run: uv sync --python 3.10 --resolution lowest-direct
      - run: uv pip list | grep -iE "^(fsspec|httpx2|pyarrow|huggingface-hub|datasets) "
      - run: uv run pytest tests/ -q
      # the dev group's datasets pulls pyarrow >= 21, so the core floors are pinned by hand here
      # (keep in sync with pyproject.toml); the hf-extra tests need huggingface_hub and are skipped
      - run: >-
          uv run --isolated --no-project --python 3.10 --with pyarrow==19.0.0 --with "numpy<2.3"
          --with fsspec==2024.3.0 --with httpx2==2.9.0 --with pytest --with "hypothesis>=6.100" --with-editable .
          pytest tests -q --ignore=tests/test_sources.py --ignore=tests/test_bucket_rows.py -k "not test_hf_"
