name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run --with blacken-docs blacken-docs -l 100 README.md CONTRACT.md docs/*.md && git diff --exit-code
      - run: uv run pytest tests/ -q
      - run: uv run --extra hf python -c "from huggingface_hub import HfFileSystem; HfFileSystem()"
