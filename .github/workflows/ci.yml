name: ci
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_call:
    inputs:
      slow:  # release.yml sets it: a release runs the slow tier too
        type: boolean
        default: false
  workflow_dispatch:
jobs:
  test:
    # a label only matters to the slow job: adding one does not rerun the matrix
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    # every supported version (requires-python >= 3.10); 3.14t (free-threaded) is informational
    # until the scientific stack ships free-threaded wheels for everything the suite imports
    continue-on-error: ${{ matrix.python == '3.14t' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python }}
      - name: the lock names public PyPI only
        # a maintainer's private index or mirror would otherwise leak into it
        shell: bash
        run: |
          set -euo pipefail
          registries=$(grep -oE 'registry = "[^"]+"' uv.lock | sort -u)
          echo "$registries"
          test "$registries" = 'registry = "https://pypi.org/simple"'
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --with blacken-docs blacken-docs -l 100 README.md CONTRACT.md docs/*.md && git diff --exit-code
      - run: uv run pytest tests/ -q
      - name: contract suite size (the tests a refactor must pass unchanged)
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest tests/ -m 'not internals and not slow' --collect-only -q | tail -n 1
      - run: uv run --extra hf python -c "from huggingface_hub import HfFileSystem; HfFileSystem()"
  slow:
    # the slow tier: many seeds, several clients on one engine, deep Hypothesis runs. On demand
    # (Actions > ci > Run workflow), on a PR labelled `slow`, or before a release; not on every push
    if: >-
      inputs.slow == true ||
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'slow') &&
       (github.event.action != 'labeled' || github.event.label.name == 'slow'))
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
      SATURATE_DEEP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uv sync --locked
      # deep Hypothesis runs take minutes per test: past the suite's 120 s deadlock guard
      - run: uv run pytest -q -o timeout=1800 --runslow tests/test_controller_slow.py
      - run: uv run pytest -q -o timeout=1800 tests/test_controller_properties.py tests/test_controller_perf.py
  types:
    # ty (pinned in the dev group) over the whole package and the test suite
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run ty check saturate tests
  lowest:
    # the declared dependency floors: an unlocked sync only ever tests the newest releases
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.10
      - run: uv sync --python 3.10 --resolution lowest-direct
      - run: uv pip list | grep -iE "^(aiohttp|anyio|fsspec|pyarrow|huggingface-hub|datasets) "
      - run: uv run pytest tests/ -q
      # the core floors are pinned by hand here (keep in sync with pyproject.toml); the hf-extra tests need huggingface_hub and are skipped
      - run: >-
          uv run --isolated --no-project --python 3.10 --with pyarrow==21.0.0 --with "numpy<2.3"
          --with fsspec==2024.3.0 --with aiohttp==3.14.4 --with anyio==4.15.1 --with pytest --with "hypothesis>=6.100" --with-editable .
          pytest tests -q --ignore=tests/test_sources.py --ignore=tests/test_bucket_rows.py -k "not test_hf_"
