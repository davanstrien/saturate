name: release
# A release is one merged PR: bump `version` in pyproject.toml and date its CHANGELOG section.
# When that reaches main, this workflow runs the full suite, publishes to PyPI, then tags the
# commit and creates the GitHub release from the CHANGELOG section. A push to main whose version
# already has a GitHub release does nothing; a run that stopped part-way can be re-run.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:
concurrency:
  group: release  # one release at a time; never cancel a run that may be publishing
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # the GitHub release is the last step, so it marks a finished release
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released: nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # fail before the tests if the CHANGELOG section is missing or still undated
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' section"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
  test:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml  # publishes only a commit that passes the full suite
    with:
      slow: true
  publish:
    needs: [check, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC) — no tokens anywhere
      contents: write   # the tag and the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      # --check-url skips files PyPI already has, so a re-run after a failed release step works
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
      - name: GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {found=1; next} /^## \[/ {if (found) exit} found' \
            CHANGELOG.md > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "saturate $VERSION" \
            --notes-file notes.md dist/*
