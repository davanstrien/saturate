name: release
on:
  push:
    tags: ["v*"]
jobs:
  test:
    uses: ./.github/workflows/ci.yml  # a tag publishes only a commit that passes the full suite
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC) — no tokens anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv publish --trusted-publishing always
