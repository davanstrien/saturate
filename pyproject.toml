[project]
name = "saturate"
version = "0.2.0"
description = "Adaptive batch-inference client: dataset in, any OpenAI-compatible endpoint, resumable parquet out"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel van Strien" }]
dependencies = [
    "anyio>=4.15.1",  # CapacityLimiter: 4.14.2/4.15.0 fixed over-admission on resize and release
    "aiohttp>=3.14.4",  # the HTTP client (saturate/http.py); vLLM requires >=3.14.3
    "pyarrow>=21",  # struct casts match fields by name (schema.cast_columns, ParquetSink._conform)
    "fsspec>=2024.3",
]

[project.optional-dependencies]
# hf:// output paths (HfFileSystem) + Hub dataset input (sources.dataset_rows).
# Pinned deliberately recent (owner steer): hf:// URIs (incl. buckets) landed in
# huggingface_hub 1.19; datasets 5.0 carries the streaming overhaul the
# streaming-by-default input leans on (hf.co/blog/streaming-datasets).
# pillow: generous-by-default — datasets image columns decode on iteration,
# and a missing Pillow kills streaming even for rows that never use the image
hf = ["huggingface_hub>=1.20", "datasets>=5.0", "pillow>=10"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "datasets>=5.0",
    "pillow>=10",  # image-column tests: datasets decodes Image features with Pillow
    "hypothesis>=6.100",
    "pytest-timeout>=2.3",
    "ty==0.0.92",  # pre-1.0: pinned, a new release can change what passes
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saturate"]

[tool.pytest.ini_options]
# a deadlock fails one test instead of hanging the suite (the 0.3 refactor rewrites shutdown)
timeout = 120
markers = [
    "internals: reaches into plumbing the 0.3 refactor replaces (Window, the events dict, through()'s hooks); rewritten with it, so `-m 'not internals'` is the suite that must pass unchanged",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
