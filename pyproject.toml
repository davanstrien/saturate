[project]
name = "pumpjack"
version = "0.1.0"
description = "Adaptive batch-inference client: dataset in, any OpenAI-compatible endpoint, resumable parquet out"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel van Strien" }]
dependencies = [
    "httpx2>=0.28",
    "pyarrow>=15",
    "fsspec>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pumpjack"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
